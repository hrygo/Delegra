name: Delegra gateway proxy image

on:
  pull_request:
    branches: [deploy]
    paths: &proxy_image_paths
      - .github/workflows/delegra-gateway-proxy-image.yml
      - packages/plugins/sandbox-providers/kubernetes/Dockerfile.gateway-proxy
      - packages/plugins/sandbox-providers/kubernetes/package.json
      - packages/plugins/sandbox-providers/kubernetes/src/gateway-proxy.ts
      - packages/plugins/sandbox-providers/kubernetes/src/gateway-proxy-server.ts
      - packages/plugins/sandbox-providers/kubernetes/src/gateway-proxy-main.ts
  push:
    branches: [deploy]
    tags: ['gateway-proxy-v*']
    paths: *proxy_image_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-proxy-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    name: Verify gateway proxy image (arm64)
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native arm64 runner
        run: test "$(uname -m)" = aarch64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:92f93f25966c544549b88144406ce8cd9dcdf5df128250711031a4acd9149a8e
      - name: Build local arm64 image
        run: >-
          docker buildx build
          --file packages/plugins/sandbox-providers/kubernetes/Dockerfile.gateway-proxy
          --platform linux/arm64
          --tag delegra-gateway-proxy:verify
          --load
          .
      - name: Smoke test non-root UID 1001 and fail-closed startup
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint id delegra-gateway-proxy:verify -u)"
          test "$uid" = "1001"
          set +e
          output="$(docker run --rm --read-only delegra-gateway-proxy:verify 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -q "PAPERCLIP_SERVER_URL"

  publish:
    name: Publish attested multi-arch digest
    needs: [verify]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'gateway-proxy-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:92f93f25966c544549b88144406ce8cd9dcdf5df128250711031a4acd9149a8e
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push multi-arch OCI image with SBOM and provenance
        id: build
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/delegra-gateway-proxy
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo_lower="$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')"
          meta_file="$RUNNER_TEMP/gateway-proxy-metadata.json"
          docker buildx build \
            --file packages/plugins/sandbox-providers/kubernetes/Dockerfile.gateway-proxy \
            --platform linux/arm64,linux/amd64 \
            --tag "${repo_lower}:${RELEASE_TAG}" \
            --sbom=true \
            --provenance=mode=min,version=v1 \
            --metadata-file "$meta_file" \
            --push \
            .
          digest="$(jq -r '."containerimage.digest"' "$meta_file")"
          test -n "$digest"
          jq -n \
            --arg image "$repo_lower" \
            --arg tag "$RELEASE_TAG" \
            --arg digest "$digest" \
            --arg commit "$GITHUB_SHA" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              immutableRef: ($image + "@" + $digest),
              platforms: ["linux/arm64", "linux/amd64"],
              commit: $commit
            }' > "$RUNNER_TEMP/gateway-proxy-release.json"
      - name: Attest immutable digest release record
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/gateway-proxy-release.json
      - name: Upload signed release record and attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-proxy-release-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/gateway-proxy-release.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
