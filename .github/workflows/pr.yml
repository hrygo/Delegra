name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # Review and update the snapshot and its routing pin together.
    uses: hrygo/Delegra/.github/workflows/pr-delegra-trusted.yml@67653d5d3ac056d7f264c27186e1a0def0145a32

  shared_ci_consistency:
    name: Shared CI snapshot consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node --test scripts/__tests__/delegra-shared-ci.test.mjs
      - run: node scripts/check-delegra-shared-ci.mjs
